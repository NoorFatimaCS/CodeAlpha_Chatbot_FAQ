<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeAlpha AI Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* Existing Styles */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        :root {
            --bg-main: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --container-bg: #ffffff;
            --text-color: #333;
            --chat-bg: #f8f9fa;
            --bot-msg: #e9ecef;
        }

        /* Dark Mode Variables */
        [data-theme="dark"] {
            --bg-main: #0f172a;
            --container-bg: #1e293b;
            --text-color: #f1f5f9;
            --chat-bg: #0f172a;
            --bot-msg: #334155;
        }

        body { 
            background: var(--bg-main); 
            height: 100vh; display: flex; justify-content: center; align-items: center; 
            transition: 0.3s;
        }

        #chat-container { 
            width: 450px; height: 650px;
            background: var(--container-bg); 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); 
            display: flex; flex-direction: column; overflow: hidden;
            transition: 0.3s;
        }

        .chat-header { 
            background: #4e54c8; color: white; padding: 20px; 
            text-align: center; font-weight: 600; font-size: 1.1rem;
            display: flex; justify-content: space-between; align-items: center;
        }

        #chat-box { 
            flex: 1; overflow-y: auto; padding: 20px; 
            background: var(--chat-bg); display: flex; flex-direction: column; gap: 15px;
        }

        .message { max-width: 80%; padding: 12px 16px; border-radius: 15px; font-size: 0.95rem; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .user { align-self: flex-end; background: #4e54c8; color: white; border-bottom-right-radius: 2px; }
        .bot { align-self: flex-start; background: var(--bot-msg); color: var(--text-color); border-bottom-left-radius: 2px; }

        .chip {
            background: #4e54c8; color: white; border: none; padding: 6px 12px;
            border-radius: 15px; font-size: 0.75rem; cursor: pointer; white-space: nowrap;
            transition: 0.2s;
        }
        .chip:hover { background: #3f44a1; }

        .input-area { 
            padding: 15px; background: var(--container-bg); 
            border-top: 1px solid rgba(0,0,0,0.1); display: flex; gap: 8px; align-items: center;
        }

        input { 
            flex: 1; padding: 10px 15px; border: 1px solid #ddd; 
            border-radius: 25px; outline: none; background: var(--chat-bg); color: var(--text-color);
        }

        .icon-btn { background: none; border: none; font-size: 1.3rem; cursor: pointer; padding: 5px; }

        #chat-box::-webkit-scrollbar { width: 5px; }
        #chat-box::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }
    </style>
</head>
<body>

<div id="chat-container">
    <div class="chat-header">
        <button onclick="toggleTheme()" id="theme-btn" class="icon-btn" style="color:white">🌙</button>
        <span>🤖 CodeAlpha AI Assistant</span>
        <button onclick="newChat()" style="background:rgba(255,255,255,0.2); border:none; color:white; padding:5px 10px; border-radius:8px; cursor:pointer; font-size: 0.8rem;">+ New</button>
    </div>

    <div id="chat-box">
        <div class="message bot">Hello! I'm your CodeAlpha assistant. How can I help you with your internship today?</div>
    </div>

    <div id="suggestions-container" style="padding: 10px; display: flex; gap: 8px; overflow-x: auto; border-top: 1px solid rgba(0,0,0,0.05);">
        <button class="chip" onclick="quickQuery('How to submit the task?')">Submission</button>
        <button class="chip" onclick="quickQuery('What are the internship perks?')">Perks</button>
        <button class="chip" onclick="quickQuery('Is there a deadline for tasks?')">Deadline</button>
    </div>

    <div class="input-area">
        <button onclick="startVoice()" class="icon-btn" title="Voice Input">🎤</button>
        <input type="text" id="user_input" placeholder="Type here..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()" style="padding: 8px 15px; border-radius: 20px; border:none; background:#4e54c8; color:white; cursor:pointer;">Send</button>
        <button onclick="downloadChat()" class="icon-btn" title="Download History">📥</button>
    </div>
</div>

<script>
    function handleKeyPress(e) {
        if (e.key === 'Enter') sendMessage();
    }

    // 1. Send Message Function
    async function sendMessage() {
        let input = document.getElementById("user_input");
        let chatBox = document.getElementById("chat-box");
        let query = input.value.trim();
        if (!query) return;

        chatBox.innerHTML += `<div class="message user">${query}</div>`;
        input.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            let response = await fetch('/get_response', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({query: query})
            });
            let data = await response.json();
            
            setTimeout(() => {
                chatBox.innerHTML += `<div class="message bot">${data.answer}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 500);
        } catch (error) {
            console.error("Error:", error);
        }
    }

    // 2. New Features Logic
    function newChat() {
        if(confirm("Start a new chat?")) {
            document.getElementById("chat-box").innerHTML = '<div class="message bot">New chat started! How can I help?</div>';
        }
    }

    function toggleTheme() {
        const body = document.body;
        const btn = document.getElementById("theme-btn");
        if (body.getAttribute("data-theme") === "dark") {
            body.removeAttribute("data-theme");
            btn.innerText = "🌙";
        } else {
            body.setAttribute("data-theme", "dark");
            btn.innerText = "☀️";
        }
    }

    function quickQuery(text) {
        document.getElementById("user_input").value = text;
        sendMessage();
    }

    function downloadChat() {
        let chatContent = "--- CodeAlpha Chat History ---\n\n";
        const messages = document.querySelectorAll(".message");
        messages.forEach(msg => {
            const role = msg.classList.contains("user") ? "You: " : "Bot: ";
            chatContent += role + msg.innerText + "\n";
        });
        const blob = new Blob([chatContent], { type: "text/plain" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "CodeAlpha_Chat.txt";
        a.click();
    }

    function startVoice() {
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'en-US';
        recognition.start();
        recognition.onresult = (event) => {
            document.getElementById("user_input").value = event.results[0][0].transcript;
            sendMessage();
        };
    }
</script>
</body>
</html>
